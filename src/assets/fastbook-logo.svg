<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="100%" height="100%">
  <!-- Transparent background -->
  <rect width="100%" height="100%" fill="transparent"/>

  <g transform="translate(45, 16)">
    <!-- Minimalist calendar outline page with subtle rounded corners -->
    <rect x="0" y="14" width="100" height="98" rx="22" ry="22" fill="none" stroke="#3B49DF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Calendar rings/loops -->
    <line x1="28" y1="4" x2="28" y2="24" stroke="#3B49DF" stroke-width="9" stroke-linecap="round"/>
    <line x1="72" y1="4" x2="72" y2="24" stroke="#3B49DF" stroke-width="9" stroke-linecap="round"/>
    
    <!-- Central fast lightning bolt cut out inside calendar -->
    <path d="M 57 32 
             L 36 68 
             L 54 68 
             L 45 94 
             L 71 58 
             L 52 58 Z" 
          fill="#3B49DF" 
          stroke="#3B49DF" 
          stroke-width="3" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
  </g>

  <!-- Wordmark "fastbook" geometric modern lowercase -->
  <g transform="translate(185, 102)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="62" 
          font-weight="800" 
          letter-spacing="-1.8px" 
          fill="#0F172A">
      fast<tspan fill="#3B49DF">book</tspan>
    </text>
  </g>
</svg>